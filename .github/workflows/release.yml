name: Release

# Pushing a version tag such as v1.0.0 publishes the GitHub release for it.
# Its notes are addon.xml's news entry for that version (scripts/release_notes.py).
# Its files are the add-on and repository installer already published on gh-pages,
# byte for byte, so the release offers exactly what Kodi installs: push gh-pages
# before the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notes from the news entry
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Packages from gh-pages
        run: |
          version="${GITHUB_REF_NAME#v}"
          repository="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("repository/repository.silo.theater/addon.xml").getroot().get("version"))')"
          git fetch --depth=1 origin gh-pages
          mkdir -p "$RUNNER_TEMP/files"
          for path in "zips/script.founderstheater/script.founderstheater-$version.zip" "repository.silo.theater-$repository.zip"; do
            git cat-file -e "FETCH_HEAD:$path" || { echo "gh-pages has no $path; publish gh-pages first"; exit 1; }
            git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/files/$(basename "$path")"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/files/*.zip
          --verify-tag --title "Founders Theater ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
